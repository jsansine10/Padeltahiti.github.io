const top=[...p.r].sort((a,b)=>b[1]-a[1]).slice(0,8).map(x=>x[0]);p.top=new Set(top)});sn[k].ix={};sn[k].ix2={};L.forEach(p=>{sn[k].ix[n1(p.n)]=p;const z=n2(p.n);sn[k].ix2[z]=sn[k].ix2[z]===undefined?p:null})}}
function render(){
$('mt').textContent=mlab(cur);const D=S()[g],q=norm($('q').value.trim());
const L=D.p.filter(p=>(!q||p.k.includes(q))&&(!favOnly||FAV.has(fk(p))));
const fc=favCount();$('fb').textContent=(favOnly||fc?'★':'☆')+' Favoris'+(fc?' ('+fc+')':'');$('fb').classList.toggle('on',favOnly);$('fb').setAttribute('aria-pressed',favOnly);
$('cnt').textContent=favOnly?L.length+' favori'+(L.length>1?'s':''):L.length+' joueur'+(L.length>1?'s':'')+(q?' trouvé'+(L.length>1?'s':''):'');
if(!L.length){$('list').innerHTML='<div class="empty">'+(favOnly&&!q?'Aucun favori pour le moment.<br>Touchez ☆ à droite d’un joueur pour l’ajouter.':'Aucun joueur trouvé')+'</div>';return}
$('list').innerHTML=L.map(p=>{
const o=open===g+p.n,fv=FAV.has(fk(p));
let det='';
if(o){const rs=[...p.r].sort((a,b)=>D.t[b[0]].d.localeCompare(D.t[a[0]].d)||b[1]-a[1]);
det='<div class="d">'+rs.map(([t,v])=>{const T=D.t[t],c=p.top.has(t);
return '<div class="r '+(c?'yes':'no')+'"><div class="tn">'+T.n.replace(/&/g,'&amp;')+(c?'<span class="tag">compte</span>':'')+'<small>'+fmt(T.d)+'</small></div><b>+'+v+' pts</b></div>'}).join('')+charts(p)+hist(p)+'</div>'}
return '<div class="p'+(o?' open':'')+'"><div class="hw"><button class="h" data-n="'+p.n.replace(/"/g,'&quot;')+'">'+(p.rk<=3?'<span class="rk tr">'+trophy(p.rk)+'</span>':'<span class="rk">'+p.rk+'</span>')+'<span class="nm">'+p.n.replace(/&/g,'&amp;')+'<small>'+p.r.length+' tournoi'+(p.r.length>1?'s':'')+'</small></span>'+dl(p)+'<span class="pt">'+p.p+'<small>'+pd(p)+'</small></span></button><button class="fv'+(fv?' on':'')+'" data-f="'+fk(p).replace(/"/g,'&quot;')+'" aria-pressed="'+fv+'" aria-label="'+(fv?'Retirer des favoris':'Ajouter aux favoris')+'">'+(fv?'★':'☆')+'</button></div>'+det+'</div>'}).join('')}
$('list').addEventListener('click',e=>{const f=e.target.closest('.fv');if(f){const k=f.dataset.f;FAV.has(k)?FAV.delete(k):FAV.add(k);saveFav();render();return}
const b=e.target.closest('.h');if(!b)return;const k=g+b.dataset.n;open=open===k?null:k;render()});
$('fb').onclick=()=>{favOnly=!favOnly;open=null;render()};
$('q').addEventListener('input',()=>{open=null;render()});
function sw(x){g=x;open=null;$('bH').classList.toggle('on',x==='H');$('bF').classList.toggle('on',x==='F');render()}
$('bH').onclick=()=>sw('H');$('bF').onclick=()=>sw('F');
for(const sn of Object.values(SNAPS))for(const k of['H','F'])sn[k].t.forEach(t=>{if(/meilleurs r/i.test(t.n))t.n='2 meilleurs résultats 2025'});
const mo=$('mo');mo.innerHTML=keys().reverse().map(k=>'<option value="'+k+'">'+mlab(k)+'</option>').join('');mo.value=cur;
mo.onchange=()=>{cur=mo.value;open=null;render()};
const up=$('up');addEventListener('scroll',()=>up.classList.toggle('show',scrollY>400),{passive:true});up.onclick=()=>scrollTo({top:0,behavior:'smooth'});
/* Installation sur l'écran d'accueil */
let dp=null;const stand=(window.matchMedia&&matchMedia('(display-mode: standalone)').matches)||navigator.standalone;
const ios=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
addEventListener('beforeinstallprompt',e=>{e.preventDefault();dp=e;if(!stand)$('inst').hidden=false});
addEventListener('appinstalled',()=>{$('inst').hidden=true});
if(ios&&!stand&&/^https?:/.test(location.protocol))$('inst').hidden=false;
$('ib').onclick=async()=>{if(dp){dp.prompt();try{await dp.userChoice}catch(e){}dp=null;$('inst').hidden=true}else{const h=$('ih');h.textContent='Touchez le bouton Partager de Safari, puis « Sur l’écran d’accueil ».';h.hidden=!h.hidden}};
prep();render();
</script><script>if('serviceWorker' in navigator&&/^https?:/.test(location.protocol))navigator.serviceWorker.register('sw.js').catch(function(){});</script></body></html>
