.tag{font-size:11px;background:var(--acs);color:var(--ac);border-radius:6px;padding:1px 6px;margin-left:6px;font-weight:600}
.note{color:var(--mu);font-size:12.5px;margin:10px 0 0}
.empty{text-align:center;color:var(--mu);padding:30px}
